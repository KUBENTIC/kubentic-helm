{{- if .Values.logShipper.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubentic-vector
  namespace: {{ include "kubentic-operator.namespace" . }}
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubentic-vector
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubentic-vector
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubentic-vector
subjects:
  - kind: ServiceAccount
    name: kubentic-vector
    namespace: {{ include "kubentic-operator.namespace" . }}
{{- end }}
