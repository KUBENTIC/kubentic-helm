apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubentic-operator-manager
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubentic-operator-manager
subjects:
  - kind: ServiceAccount
    name: kubentic-operator
    namespace: {{ include "kubentic-operator.namespace" . }}
