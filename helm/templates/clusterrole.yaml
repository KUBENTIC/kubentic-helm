apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubentic-operator-manager
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubentic.io"]
    resources: ["kubenticagents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubentic.io"]
    resources: ["kubenticagents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubentic.io"]
    resources: ["kubenticagents/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Permissions the operator must hold in order to grant them to the agent ClusterRole.
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
