{{- if and .Values.subscriptionCheck.enabled .Values.agent.create }}
---
# Pre-install/pre-upgrade Job that validates the access token against the Kubentic
# backend before any cluster resources are created. helm install aborts if this fails.
# On success it stores the api_key returned by the backend as a K8s Secret so the
# agent CronJob can use it as KUBENTIC_ACCESS_TOKEN at runtime.
apiVersion: batch/v1
kind: Job
metadata:
  name: kubentic-subscription-check
  namespace: {{ include "kubentic-operator.namespace" . }}
  labels:
    {{- include "kubentic-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubentic-subscription-check
    spec:
      restartPolicy: Never
      serviceAccountName: kubentic-hook
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: check
          image: {{ .Values.subscriptionCheck.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "Validating Kubentic subscription..."

              response=$(curl -s \
                --max-time {{ .Values.subscriptionCheck.timeoutSeconds }} \
                {{- if .Values.agent.backend.tlsSkipVerify }}
                -k \
                {{- end }}
                -H "Authorization: Bearer ${KUBENTIC_ACCESS_TOKEN}" \
                -w "\n__STATUS__%{http_code}" \
                {{ .Values.subscriptionCheck.validateUrl }})

              code=$(printf '%s' "$response" | grep '__STATUS__' | sed 's/__STATUS__//')
              body=$(printf '%s' "$response" | grep -v '__STATUS__')

              if [ "$code" != "200" ]; then
                echo ""
                echo "ERROR: Subscription validation failed (HTTP $code)."
                echo "  • Verify your access token is correct."
                echo "  • Check your subscription at https://kubentic.ai"
                echo "  • Validate URL: {{ .Values.subscriptionCheck.validateUrl }}"
                exit 1
              fi

              api_key=$(printf '%s' "$body" | grep -o '"api_key":"[^"]*"' | cut -d'"' -f4)

              if [ -z "$api_key" ]; then
                echo "ERROR: Validation succeeded but no api_key in response."
                exit 1
              fi

              echo "Subscription active. Storing API key..."

              K8S="https://kubernetes.default.svc"
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              NS="{{ include "kubentic-operator.namespace" . }}"

              SECRET_JSON=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"kubentic-apikey","namespace":"%s"},"stringData":{"api-key":"%s"}}' "$NS" "$api_key")

              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                --cacert "$CACERT" \
                -H "Authorization: Bearer $SA_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST \
                "${K8S}/api/v1/namespaces/${NS}/secrets" \
                -d "$SECRET_JSON")

              if [ "$http_code" = "409" ]; then
                curl -s -o /dev/null \
                  --cacert "$CACERT" \
                  -H "Authorization: Bearer $SA_TOKEN" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH \
                  "${K8S}/api/v1/namespaces/${NS}/secrets/kubentic-apikey" \
                  -d "$SECRET_JSON"
              elif [ "$http_code" != "201" ]; then
                echo "ERROR: Failed to store API key (HTTP $http_code)."
                exit 1
              fi

              echo "Done — proceeding with installation."
          env:
            - name: KUBENTIC_ACCESS_TOKEN
              {{- if .Values.agent.accessToken.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.accessToken.existingSecret }}
                  key: {{ .Values.agent.accessToken.existingKey | default "token" }}
              {{- else }}
              value: {{ required "agent.accessToken.value is required (or provide agent.accessToken.existingSecret)" .Values.agent.accessToken.value | quote }}
              {{- end }}
{{- end }}
