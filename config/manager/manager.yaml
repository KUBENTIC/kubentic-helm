apiVersion: v1
kind: Namespace
metadata:
  name: kubentic-system
  labels:
    app.kubernetes.io/name: kubentic-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubentic-operator
  namespace: kubentic-system
  labels:
    app.kubernetes.io/name: kubentic-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubentic-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubentic-operator
        app.kubernetes.io/component: operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: kubentic-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: ghcr.io/kubentic/operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --leader-election-id=kubentic-operator
          command:
            - /manager
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
