apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubentic-operator-leader-election
  namespace: kubentic-system
  labels:
    app.kubernetes.io/name: kubentic-operator
    app.kubernetes.io/component: operator
rules:
  # ConfigMap-based lock (legacy fallback).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Lease-based lock (modern, preferred).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for leadership change notifications.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
