name: Build & Push Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: operator
            dockerfile: Dockerfile
            context: .
            image: ghcr.io/kubentic/operator
          - name: agent
            dockerfile: agent/Dockerfile
            context: agent
            image: ghcr.io/kubentic/agent
          - name: subscription-check
            dockerfile: subscription-check/Dockerfile
            context: subscription-check
            image: ghcr.io/kubentic/subscription-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.version.outputs.version }}
