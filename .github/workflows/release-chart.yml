name: Release Helm Chart

# Trigger on version tags like v0.1.0, v1.2.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # push to gh-pages
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Add chart dependencies
        run: |
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts/
          helm repo update
          helm dependency build ./helm

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            -d ./dist

      # ── Publish to gh-pages ────────────────────────────────────────────────
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          # gh-pages branch must exist; create it once with: git checkout --orphan gh-pages && git commit --allow-empty -m "init" && git push origin gh-pages

      - name: Update Helm index
        run: |
          cp dist/*.tgz gh-pages/
          if [ -f gh-pages/index.yaml ]; then
            helm repo index gh-pages/ --url "https://helm.kubentic.ai/" --merge gh-pages/index.yaml
          else
            helm repo index gh-pages/ --url "https://helm.kubentic.ai/"
          fi

      - name: Publish CRDs and CNAME
        run: |
          mkdir -p gh-pages/crds
          cp helm/crds/kubenticagents.yaml gh-pages/crds/crds.yaml
          echo "helm.kubentic.ai" > gh-pages/CNAME

      - name: Commit and push gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin gh-pages

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
