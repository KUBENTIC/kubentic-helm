name: Init gh-pages branch

# Run this ONCE manually from Actions → "Run workflow".
# It creates the gh-pages branch with an empty Helm index and the CRDs.
# After it runs, enable GitHub Pages in repo Settings → Pages → gh-pages branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Create empty Helm index
        run: |
          mkdir -p _site/crds
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)/"
          helm repo index _site/ --url "$REPO_URL"
          cp helm/crds/kubenticagents.yaml _site/crds/crds.yaml

      - name: Push to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . --quiet
          cp -r _site/. .
          git add index.yaml crds/
          git commit -m "Initialize Helm repository"
          git push origin gh-pages --force
